<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FlatRaster</title>
<style>
/* Layout: the picture is a native view outside this page. Here: the recorder deck on top, the shelf of recordings scrolling under it. */
:root{--bg:#1b2430;--panel:#253141;--line:#3a4a5e;--fg:#edf1f5;--dim:#a2b0c0;--rec:#e5484d;--play:#7cc8a4;--amber:#f0b45a;
--mono:ui-monospace,"Roboto Mono","Droid Sans Mono",monospace;--ui:"Roboto Condensed","sans-serif-condensed",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 var(--ui);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#deck{flex:none;max-height:70%;overflow-y:auto;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#deck>*{flex:none}
#top{display:flex;align-items:center;gap:14px}
#recb{flex:none;width:64px;height:64px;border-radius:50%;background:var(--rec);border:4px solid var(--fg);color:#fff;font-size:13px;font-weight:800;padding:0}
#recb.on{border-radius:12px}
#recb:disabled,#flip:disabled{opacity:.45}
#flip{flex:none;width:64px;min-height:64px;padding:0;font-size:12px;line-height:1.2}
#read{flex:1;min-width:0}
#clock{font:600 30px/1.1 var(--mono);font-variant-numeric:tabular-nums}
#rate,#enc{color:var(--dim);font:12px/1.4 var(--mono);min-height:17px;overflow-wrap:anywhere}
.meter{height:6px;background:var(--bg);border-radius:2px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--play)}
button{font:inherit;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;min-height:44px;padding:0 12px}
button:active{background:var(--line)}button:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#set{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
label{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:12px;min-width:0}
select{min-width:0;min-height:40px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px}
select:disabled{opacity:.5}
#more{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#more button{min-height:40px;font-size:14px}
#msg{color:var(--amber);font-size:14px;min-height:0}
#shelf{flex:1;overflow-y:auto;padding:6px 14px 20px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item b{display:block;font:600 15px var(--mono);overflow-wrap:anywhere}
.item span{color:var(--dim);font:12px var(--mono)}
.item .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.item .row button{min-height:40px;font-size:14px;padding:0 10px}
.item.playing b{color:var(--play)}
.bar{height:4px;background:var(--bg);margin-top:6px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--play)}
#empty{color:var(--dim);padding:18px 0;font-size:14px}
</style></head><body>
<div id="app">
 <div id="deck">
  <div id="top">
   <button id="recb" aria-label="Record">REC</button>
   <button id="flip" aria-label="Switch camera">Flip<br>camera</button>
   <div id="read"><div id="clock">00:00</div><div id="rate">Ready</div><div class="meter" aria-hidden="true"><i id="lvl"></i></div></div>
  </div>
  <div id="enc"></div>
  <div id="msg" role="status"></div>
  <div id="more"><button id="tog" aria-expanded="true">Hide settings</button><button id="newpal">Pick colours now</button></div>
  <div id="set">
   <label>Pictures per second<select id="fps"><option value="0.5">0.5</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></label>
   <label>Picture size<select id="size"><option value="0">160 x 120</option><option value="1">240 x 176</option><option value="2">320 x 240</option><option value="3">480 x 360</option></select></label>
   <label>Colours<select id="colors"><option>4</option><option>6</option><option>8</option><option>12</option><option>16</option><option>24</option><option>32</option></select></label>
   <label>Smoothing<select id="smooth"><option value="0">Off</option><option value="1">Light</option><option value="2">Medium</option><option value="3">Strong</option><option value="5">Very strong</option></select></label>
   <label>New colours<select id="pal"><option value="0">Only when needed</option><option value="5">Every 5 s</option><option value="10">Every 10 s</option><option value="30">Every 30 s</option><option value="60">Every minute</option></select></label>
   <label>Clean-up<select id="clean"><option value="1">Light</option><option value="2">Medium</option><option value="3">Strong</option></select></label>
   <label>Colour fit<select id="track"><option value="0">Locked</option><option value="16">Every picture, colours change rarely</option><option value="8">Every picture, colours change sometimes</option><option value="4">Every picture, colours change readily</option></select></label>
   <label>Borders<select id="round"><option value="0">As they fall</option><option value="1">Rounded</option><option value="2">Very rounded</option></select></label>
   <label>Exposure and colour<select id="lock"><option value="0">Follow the light</option><option value="1">Lock while recording</option></select></label>
   <label>Faces<select id="focus"><option value="0">No special treatment</option><option value="1">Rest in half the colours</option><option value="2">Rest in a quarter of the colours</option></select></label>
   <label>Repeating movement<select id="ignore"><option value="0">Record</option><option value="1">Ignore a little</option><option value="2">Ignore</option><option value="3">Ignore a lot</option></select></label>
   <label>Still pictures<select id="still"><option value="0">Record</option><option value="1">Skip if nothing moves</option><option value="2">Skip small changes</option><option value="3">Skip most changes</option></select></label>
   <label>Video bitrate<select id="kbps"><option value="2">2 kbps</option><option value="3">3 kbps</option><option value="5">5 kbps</option><option value="8">8 kbps</option><option value="12">12 kbps</option><option value="20">20 kbps</option><option value="35">35 kbps</option><option value="50">50 kbps</option><option value="100">100 kbps</option></select></label>
   <label>Video format<select id="codec"><option value="-1">Best available</option><option value="2">AV1</option><option value="1">HEVC</option><option value="0">H.264</option></select></label>
   <label>Full picture every<select id="key"><option value="10">10 s</option><option value="30">30 s</option><option value="60">1 min</option><option value="120">2 min</option></select></label>
   <label>Silence<select id="skip"><option value="0">Record</option><option value="1">Skip</option></select></label>
   <label>Voice (Codec 2 bit/s)<select id="voice"></select></label>
   <label>Camera<select id="front"><option value="0">Back</option><option value="1">Front</option></select></label>
  </div>
 </div>
 <div id="shelf"><div id="list"></div><div id="empty">No recordings yet.</div></div>
</div>
<script>
// Outside the app (a desktop browser) a stand-in bridge keeps the page usable for layout checks.
var A = window.Android || {status:function(){return '{"camera":true,"avail":"0,1"}'},list:function(){return '[]'},voiceModes:function(){return '["3200","2400","1600","1400","1300","1200","700C","450"]'},config:function(){},newPalette:function(){},startRec:function(){},stopRec:function(){},play:function(){},stopPlay:function(){},mp4:function(){},remove:function(){},rename:function(){return true},share:function(){}};
var $ = function(id){return document.getElementById(id)};
var ids = ['fps','size','colors','smooth','pal','track','clean','round','lock','focus','ignore','still','kbps','key','skip','codec','voice','front'];
var defaults = {fps:'2',size:'2',colors:'8',smooth:'2',pal:'0',track:'0',clean:'1',round:'1',lock:'0',focus:'0',ignore:'0',still:'0',kbps:'5',key:'10',skip:'0',codec:'-1',voice:'1200',front:'0'};
var rec = false, listKey = '', msgUntil = 0;

JSON.parse(A.voiceModes()).forEach(function(m){var o=document.createElement('option');o.textContent=m;$('voice').appendChild(o)});
var saved = {}; try { saved = JSON.parse(localStorage.getItem('set') || '{}') } catch (e) {}
ids.forEach(function(id){ $(id).value = saved[id] != null ? saved[id] : defaults[id]; if ($(id).selectedIndex < 0) $(id).value = defaults[id]; $(id).onchange = push; });

function push(){
  var s = {}; ids.forEach(function(id){ s[id] = $(id).value });
  try { localStorage.setItem('set', JSON.stringify(s)) } catch (e) {}
  A.config(JSON.stringify({fps:+s.fps,size:+s.size,colors:+s.colors,smooth:+s.smooth,pal:+s.pal,track:+s.track,clean:+s.clean,round:+s.round,lock:s.lock==='1',focus:+s.focus,ignore:+s.ignore,still:+s.still,kbps:+s.kbps,key:+s.key,skip:s.skip==='1',codec:+s.codec,voice:s.voice,front:s.front==='1'}));
}
function clock(ms){ var s=Math.floor(ms/1000), m=Math.floor(s/60); return (m<10?'0':'')+m+':'+(s%60<10?'0':'')+s%60 }
function size(b){ return b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(1)+' kB' : (b/1048576).toFixed(2)+' MB' }
function say(t){ $('msg').textContent = t; msgUntil = Date.now() + 8000 }

$('recb').onclick = function(){ if (rec) A.stopRec(); else { push(); A.startRec() } };
$('newpal').onclick = function(){ A.newPalette() };
$('flip').onclick = function(){ $('front').value = $('front').value === '1' ? '0' : '1'; push(); say($('front').value === '1' ? 'Front camera' : 'Back camera') };
function fold(hide){ $('set').style.display = hide ? 'none' : ''; $('tog').textContent = hide ? 'Settings' : 'Hide settings'; $('tog').setAttribute('aria-expanded', String(!hide)); try { localStorage.setItem('fold', hide ? '1' : '') } catch (e) {} }
$('tog').onclick = function(){ fold($('set').style.display !== 'none') };
var folded = false; try { folded = localStorage.getItem('fold') === '1' } catch (e) {}
fold(folded);

function tick(){
  var s; try { s = JSON.parse(A.status()) } catch (e) { return }
  if (s.notice) say(s.notice); else if (Date.now() > msgUntil) $('msg').textContent = '';
  rec = !!s.rec;
  $('recb').className = rec ? 'on' : ''; $('recb').textContent = rec ? 'STOP' : 'REC';
  $('recb').setAttribute('aria-label', rec ? 'Stop recording' : 'Record');
  $('recb').disabled = !rec && !s.camera;
  ['size','colors','kbps','key','skip','lock','codec','voice','front','fps'].forEach(function(id){ $(id).disabled = rec });
  $('flip').disabled = rec;
  var av = (s.avail || '').split(',');
  Array.prototype.forEach.call($('codec').options, function(o){ if (o.value !== '-1') o.disabled = av.indexOf(o.value) < 0 });
  if (rec) {
    $('clock').textContent = clock(s.ms || 0);
    $('rate').textContent = 'video ' + ((s.vbps||0)/1000).toFixed(2) + ' kbps, voice ' + Math.round(s.abps||0) + ' bit/s' + (s.quiet ? ' (silence)' : '') + ', ' + size(s.bytes||0) + ', ' + (s.frames||0) + ' pictures' + (s.skipped ? ' (' + s.skipped + ' skipped)' : '');
    $('lvl').style.width = Math.round(100*(s.level||0)) + '%';
    $('lvl').style.background = s.overload ? 'var(--rec)' : (s.level||0) > 0.85 ? 'var(--amber)' : 'var(--play)';
    $('enc').textContent = s.encoder || '';
  } else {
    $('clock').textContent = s.play ? clock(s.pos||0) : '00:00';
    $('rate').textContent = s.exporting ? 'Saving MP4...' : s.play ? 'Playing ' + s.play : s.camera ? 'Ready, ' + s.w + ' x ' + s.h : 'Waiting for the camera';
    $('lvl').style.width = '0';
  }
  if (s.focus && s.camera) $('enc').textContent = (rec && s.encoder ? s.encoder + '. ' : '') + (!s.faceOk ? 'This camera does not report faces: the whole picture gets fewer colours' : s.faces ? s.faces + (s.faces > 1 ? ' faces' : ' face') + ' in full colours' : 'No face seen: the whole picture gets fewer colours');
  else if (!rec) $('enc').textContent = '';
  draw(s);
}

function draw(s){
  var items; try { items = JSON.parse(A.list()) } catch (e) { return }
  var key = JSON.stringify(items) + '|' + (s.play||'') + '|' + rec + '|' + !!s.exporting;
  if (key !== listKey) {
    listKey = key;
    var box = $('list'); box.textContent = '';
    $('empty').style.display = items.length ? 'none' : '';
    items.forEach(function(it, i){
      var d = document.createElement('div'); d.className = 'item' + (s.play === it.name ? ' playing' : '');
      var b = document.createElement('b'); b.textContent = it.name.replace(/\.frv$/, ''); d.appendChild(b);
      var sp = document.createElement('span'); var live = rec && i === 0;
      sp.textContent = live ? 'recording...' : (it.ms >= 0 ? clock(it.ms) + ', ' : 'damaged, ') + size(it.size) + (it.codec ? ', ' + it.codec : '') + (it.ms > 0 ? ', ' + (it.size*8/it.ms).toFixed(2) + ' kbps in all' : '');
      d.appendChild(sp);
      if (!live) {
        var row = document.createElement('div'); row.className = 'row';
        var add = function(label, fn, off){ var x = document.createElement('button'); x.textContent = label; x.onclick = fn; x.disabled = !!off; row.appendChild(x) };
        if (s.play === it.name) add('Stop', function(){ A.stopPlay() }); else add('Play', function(){ A.play(it.name) }, rec);
        add('Save MP4', function(){ A.mp4(it.name) }, s.exporting);
        add('Share', function(){ A.share(it.name) });
        add('Rename', function(){ var n = prompt('New name', it.name.replace(/\.frv$/, '')); if (n && !A.rename(it.name, n)) say('That name is taken or not usable') });
        add('Delete', function(){ if (confirm('Delete ' + it.name + '?')) A.remove(it.name) });
        d.appendChild(row);
        if (s.play === it.name) { var bar = document.createElement('div'); bar.className = 'bar'; var f = document.createElement('i'); f.id = 'pbar'; bar.appendChild(f); d.appendChild(bar) }
      }
      box.appendChild(d);
    });
  }
  var p = $('pbar'); if (p && s.dur) p.style.width = Math.min(100, 100*(s.pos||0)/s.dur) + '%';
}

push(); tick(); setInterval(tick, 300);
</script></body></html>
